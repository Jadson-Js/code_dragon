services:
  db:
    image: postgres:16-alpine
    container_name: codedragon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-codedragon_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-codedragon}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: codedragon_app
    command: npm start
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/app
      - /usr/app/node_modules # Preserva node_modules do container
    environment:
      DATABASE_URL: postgresql://${DB_USER:-codedragon_admin}:${DB_PASSWORD:-admin123}@db:5432/${DB_NAME:-codedragon}?schema=public
      NODE_ENV: ${NODE_ENV:-development}

volumes:
  postgres_data:
