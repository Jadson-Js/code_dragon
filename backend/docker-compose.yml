services:
  app:
    build: .
    container_name: codedragon_app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/generated
    networks:
      - codedragon_net
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: codedragon_db
    env_file:
      - .env
    ports:
      - "54333:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - codedragon_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codedragon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codedragon_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: codedragon_nginx
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - codedragon_net
    restart: unless-stopped

networks:
  codedragon_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
